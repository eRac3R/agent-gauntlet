name: ci
on: [push, pull_request]
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit + DeepEval tests
        run: python -m pytest -q
      - name: Regression gate (fails if any baseline case now fails)
        run: python -m gauntlet gate --agent resilient
      - name: Build report
        run: python -m gauntlet demo --delay 0 && ls reports
      - uses: actions/upload-artifact@v4
        with: { name: gauntlet-report, path: reports/report.html }
